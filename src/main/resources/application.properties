spring.application.name=event-registration-system
# Use environment variables for deployment with local defaults for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/event_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mohanakrishna}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=${PORT:8080}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkeymysecretkeymysecretkeymysecretkey}
app.jwt.expiration=86400000
